name: UI verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  verify:
    name: Full checks and golden screenshots
    # Golden baselines use the macOS PingFang font.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Locate the golden-test font
        run: swift tool/ci/locate_golden_font.swift
      - name: Test signing preparation with fake credentials
        run: python3 -m unittest discover -s test/ci -v
      - name: Run the project verification gates
        run: |
          dart run tool/harness.dart start --kind native --goal "Verify UI and project gates" --accept "Offline checks, generated code and coverage pass" --risk "No paid live sessions or real credentials in tests"
          dart run tool/harness.dart skills --load
          dart run tool/harness.dart check
      - name: Preserve check diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.run_id }}
          path: build/harness/runs/
          if-no-files-found: ignore
          retention-days: 14

