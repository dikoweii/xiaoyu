name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  verify:
    name: Android offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting and static analysis
        run: |
          dart format --output=none --set-exit-if-changed lib test tool integration_test
          flutter analyze --no-pub --fatal-infos
      - name: Test signing preparation with fake credentials
        run: python3 -m unittest discover -s test/ci -v
      - name: Run ordinary tests
        # Golden screenshots run in the independent UI verification workflow.
        run: |
          python3 - <<'PYTEST'
          import subprocess
          from pathlib import Path
          golden = Path('test/ui/golden_test.dart')
          tests = sorted(str(path) for path in Path('test').rglob('*_test.dart') if path != golden)
          if not tests:
              raise SystemExit('No ordinary tests were found.')
          subprocess.run(['flutter', 'test', '--no-pub', '--coverage', *tests], check=True)
          PYTEST
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-checks-${{ github.run_id }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Signed Android APK
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/ci/prepare_android_signing.py
      - name: Prepare release metadata
        id: metadata
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          match = re.search(r'^version:\s*(.+)$', Path('pubspec.yaml').read_text(), re.MULTILINE)
          if not match:
              raise SystemExit('pubspec.yaml has no version.')
          version = match.group(1).strip().strip("\"'").split('+', 1)[0]
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?', version):
              raise SystemExit('Unsupported release version.')
          tag = f"android-v{version}-build.{os.environ['GITHUB_RUN_NUMBER']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ntag={tag}\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'APK_NAME=xiaoyu-{tag}-arm64-v8a.apk\n')
          PY
      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --split-per-abi --build-number "$((1000 + GITHUB_RUN_NUMBER))"
      - name: Verify APK signature and collect release files
        run: |
          python3 - <<'PY'
          import os, shutil, subprocess, zipfile
          from pathlib import Path
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools'
          signers = sorted(tools.glob('*/apksigner'))
          if not signers:
              raise SystemExit('Android apksigner is unavailable.')
          apk = Path('build/app/outputs/flutter-apk/app-arm64-v8a-release.apk')
          with zipfile.ZipFile(apk) as archive:
              abis = {name.split('/')[1] for name in archive.namelist() if name.startswith('lib/') and name.endswith('.so')}
          if abis != {'arm64-v8a'}:
              raise SystemExit(f'Unexpected APK architectures: {sorted(abis)}')
          subprocess.run([str(signers[-1]), 'verify', '--verbose', str(apk)], check=True)
          Path('dist').mkdir()
          shutil.copyfile(apk, Path('dist') / os.environ['APK_NAME'])
          PY
          cd dist
          sha256sum "$APK_NAME" > SHA256SUMS.txt
          cat > release-notes.md <<EOF
          小遇 Android 自动构建预发布版本。

          - 源码提交：$GITHUB_SHA
          - 来源分支：$GITHUB_REF_NAME
          - 最低系统：Android 8.0；仅支持 arm64-v8a（64 位 ARM）设备
          - APK 使用固定的小遇签名；此前的调试签名安装包需要先卸载。
          - 真实通话需要自行配置 Vidu API Key，云端费用以平台记录为准。
          - 自动检查及签名校验不代表真实 RTC、设备和视觉验收。

          下载 APK 即可安装，SHA256SUMS.txt 用于核对文件摘要。
          EOF
      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/xiaoyu-release.jks"

  publish:
    name: Publish GitHub Release
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-${{ github.run_id }}
          path: dist
      - name: Upload APK and publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.android.outputs.tag }}
          APP_VERSION: ${{ needs.android.outputs.version }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title "小遇 Android $APP_VERSION · build $GITHUB_RUN_NUMBER" --notes-file dist/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
