name: iOS unsigned release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  ios:
    name: Unsigned iOS device IPA
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies with Swift Package Manager
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Check formatting and static analysis
        run: |
          dart format --output=none --set-exit-if-changed lib test tool integration_test
          flutter analyze --no-pub --fatal-infos
      - name: Test CI helpers with offline fixtures
        run: python3 -m unittest discover -s test/ci -v
      - name: Prepare release metadata
        id: metadata
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          match = re.search(r'^version:\s*(.+)$', Path('pubspec.yaml').read_text(), re.MULTILINE)
          if not match:
              raise SystemExit('pubspec.yaml has no version.')
          version = match.group(1).strip().strip("\"'").split('+', 1)[0]
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?', version):
              raise SystemExit('Unsupported release version.')
          tag = f"ios-v{version}-unsigned-build.{os.environ['GITHUB_RUN_NUMBER']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ntag={tag}\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'IPA_NAME=xiaoyu-{tag}.ipa\n')
          PY
      - name: Build an unsigned iPhoneOS app
        run: flutter build ios --release --no-codesign --no-pub --build-number "$((1000 + GITHUB_RUN_NUMBER))"
      - name: Package the unsigned IPA
        run: |
          xcrun lipo -verify_arch arm64 build/ios/iphoneos/Runner.app/Runner
          python3 tool/ci/package_unsigned_ipa.py build/ios/iphoneos/Runner.app "dist/$IPA_NAME"
          cd dist
          shasum -a 256 "$IPA_NAME" > SHA256SUMS.txt
          cat > release-notes.md <<EOF
          小遇 iOS 未签名 IPA，仅供自行重签安装。

          - 源码提交：$GITHUB_SHA
          - 来源分支：$GITHUB_REF_NAME
          - 最低系统：iOS 15；真机 ARM64 Release 构建
          - 未提供 Apple 签名或设备授权，下载后需要使用自己的有效签名重新签名。
          - 本产物不是 TestFlight 或 App Store 分发包，不能下载后直接安装。
          - 真实通话需要在 App 中配置 Vidu API Key。
          - 构建及封装检查不代表重签安装、设备、真实 RTC 或视觉验收。

          SHA256SUMS.txt 用于核对 IPA 文件摘要。
          EOF
      - name: Upload unsigned release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-unsigned-release-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish unsigned IPA to GitHub Release
    needs: ios
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-unsigned-release-${{ github.run_id }}
          path: dist
      - name: Publish the unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.ios.outputs.tag }}
          APP_VERSION: ${{ needs.ios.outputs.version }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title "小遇 iOS $APP_VERSION · unsigned · build $GITHUB_RUN_NUMBER" --notes-file dist/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.ipa dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          echo "Unsigned IPA: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
